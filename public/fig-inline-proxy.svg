    <line x1="92" y1="126" x2="163" y2="126"/><line x1="237" y1="126" x2="308" y2="126"/>
    <line x1="92" y1="170" x2="163" y2="170"/>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="7.5">
