    <text x="176" y="78">allow</text><text x="176" y="92">block</text>
    <text x="176" y="106">redact</text><text x="176" y="120">rewrite</text>
    <text x="176" y="134">quarantine</text><text x="176" y="148">approve</text>
  </g>

