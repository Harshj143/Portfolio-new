    <text x="26" y="130" fill="#46464A">http_get</text>
    <text x="26" y="174" fill="#46464A">exec_sh</text>
    <text x="318" y="86" fill="#46464A">fs</text>
    <text x="318" y="130" fill="#46464A">net</text>
