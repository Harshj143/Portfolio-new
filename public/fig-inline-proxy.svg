  <text x="16" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="7.5" fill="#86868C">FAIL-CLOSED &#183; EVERY CALL INSPECTED &#183; DECIDED &#183; LOGGED</text>
