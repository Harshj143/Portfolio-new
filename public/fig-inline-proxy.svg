    <text x="330" y="22">TOOLS</text>
  </g>
  <line x1="16" y1="30" x2="384" y2="30" stroke="#C6C5BE"/>

  <g fill="none" stroke="#111112" stroke-width="1.2">
    <rect x="16" y="52" width="76" height="146" rx="3"/>
    <rect x="308" y="52" width="76" height="146" rx="3"/>
  </g>
  <rect x="163" y="44" width="74" height="162" rx="3" fill="#E4E3DD" stroke="#C2341D" stroke-width="1.4"/>

